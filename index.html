<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Round Tuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF4E9;
    --mat:#EFE3CB;
    --mat-edge:#E3D3AF;
    --ink:#4B3B30;
    --ink-soft:#8A7768;
    --ink-faint:#B7A896;
    --card-edge: rgba(75,59,48,0.14);
    --shadow: rgba(75,59,48,0.22);
    --surface:#FFFDF9;
    --surface-edge: rgba(75,59,48,0.10);
    --accent:#D97A5B;
    --accent-ink:#FFFDF9;
    --danger:#C15B4A;
    --focus:#3B7A8A;
    --font-display:'Fredoka', 'Baloo 2', ui-rounded, 'Segoe UI Rounded', sans-serif;
    --font-body:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#241E1A;
      --mat:#2E2620;
      --mat-edge:#3A3026;
      --ink:#F1E6D8;
      --ink-soft:#C9B9A8;
      --ink-faint:#8A7768;
      --card-edge: rgba(0,0,0,0.35);
      --shadow: rgba(0,0,0,0.55);
      --surface:#2C2521;
      --surface-edge: rgba(255,255,255,0.08);
      --accent:#E08A6B;
      --accent-ink:#241E1A;
      --danger:#E2887A;
      --focus:#6FB6C6;
    }
  }
  :root[data-theme="dark"]{
    --paper:#241E1A; --mat:#2E2620; --mat-edge:#3A3026; --ink:#F1E6D8; --ink-soft:#C9B9A8;
    --ink-faint:#8A7768; --card-edge: rgba(0,0,0,0.35); --shadow: rgba(0,0,0,0.55);
    --surface:#2C2521; --surface-edge: rgba(255,255,255,0.08); --accent:#E08A6B;
    --accent-ink:#241E1A; --danger:#E2887A; --focus:#6FB6C6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding: max(18px, env(safe-area-inset-top)) 16px 40px;
    position:relative;
  }

  /* ---------- Header / wordmark ---------- */
  .wordmark{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    margin: 4px 0 2px;
  }
  .wordmark h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size: clamp(28px, 7vw, 36px);
    margin:0;
    letter-spacing: 0.2px;
  }
  .wordmark .a{ color:var(--accent); }
  .tagline{
    font-size:14px; color:var(--ink-soft); margin: 0 0 20px; max-width: 46ch;
  }

  /* ---------- Home: shelf of trays ---------- */
  .shelf{ display:flex; flex-direction:column; gap:14px; }

  .tray{
    background:var(--mat);
    border:1px solid var(--mat-edge);
    border-radius:22px;
    padding:14px 16px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    text-align:left;
    width:100%;
    color:inherit;
  }
  .tray:hover{ transform: translateY(-1px); }
  .tray:active{ transform: translateY(1px) scale(.995); }

  .tray-peek{
    position:relative;
    width:56px; height:44px;
    flex:0 0 auto;
  }
  .peek-dot{
    position:absolute; width:38px; height:38px; border-radius:50%;
    border:1.5px solid var(--card-edge);
    box-shadow: 0 2px 4px var(--shadow);
  }
  .peek-dot.p2{ left:9px; top:2px; opacity:.85; }
  .peek-dot.p3{ left:18px; top:0; }

  .tray-body{ flex:1; min-width:0; }
  .tray-name{
    font-family:var(--font-display); font-weight:600; font-size:18px; margin:0 0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tray-meta{ font-size:13px; color:var(--ink-soft); }
  .tray-chevron{ color:var(--ink-faint); font-size:20px; flex:0 0 auto; }

  .tray.add-tray{
    background:transparent; border:2px dashed var(--mat-edge);
    justify-content:center; color:var(--ink-soft);
  }
  .tray.add-tray .plus{ font-size:22px; font-family:var(--font-display); color:var(--accent); }

  /* ---------- Category view ---------- */
  .cat-header{
    display:flex; align-items:center; gap:10px; margin-bottom: 6px;
  }
  .icon-btn{
    background:var(--surface); border:1px solid var(--surface-edge);
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; color:var(--ink); flex:0 0 auto;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .icon-btn:active{ transform: scale(.94); }
  .cat-title{
    font-family:var(--font-display); font-weight:600; font-size:22px; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .done-pill{
    background:var(--surface); border:1px solid var(--surface-edge);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }

  .stack-mat{
    background:var(--mat);
    border:1px solid var(--mat-edge);
    border-radius:28px;
    margin-top:14px;
    padding: 28px 16px 20px;
    display:flex; flex-direction:column; align-items:center;
    min-height: 360px;
  }

  .stack-count{
    font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--surface-edge);
    padding:4px 12px; border-radius:999px;
  }

  .stack-area{
    position:relative;
    width: min(78vw, 260px);
    height: min(78vw, 260px);
    margin: 6px 0 22px;
  }

  .card-behind{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--card-edge);
    box-shadow: 0 4px 10px var(--shadow);
  }
  .card-behind.b1{ transform: translate(4%, 5%) rotate(-6deg); }
  .card-behind.b2{ transform: translate(-4%, 6%) rotate(5deg); }

  .card{
    position:absolute; inset:0;
    perspective: 1200px;
    cursor:pointer;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transition: transform .5s cubic-bezier(.4,.15,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{ transform: rotateY(180deg); }
  .card.leaving .card-inner{ transition: none; }

  .card-face{
    position:absolute; inset:0; border-radius:50%;
    backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border: 2px solid var(--card-edge);
    box-shadow: 0 8px 18px var(--shadow);
    padding: 18px;
    text-align:center;
  }
  .card-face.front{ }
  .card-face.back{
    transform: rotateY(180deg);
    background:var(--surface);
    justify-content:flex-start;
    padding: 20px 22px;
    overflow-y:auto;
    gap:10px;
  }

  .card-face.front .task-text{
    font-family:var(--font-display); font-weight:600;
    font-size: clamp(15px, 4.4vw, 19px);
    line-height:1.25;
    color: var(--card-ink, #4B3B30);
    max-height: 82%;
    overflow:hidden;
    word-break: break-word;
  }
  .card-face.front .flip-hint{
    position:absolute; bottom:16px; right:18px; font-size:15px; opacity:.55;
  }
  .card-face.front .repeat-badge{
    position:absolute; top:16px; left:18px; font-size:14px; opacity:.6;
  }

  .back-row{ width:100%; text-align:left; }
  .back-label{ font-size:11px; font-weight:800; letter-spacing:.3px; color:var(--ink-soft); margin:0 0 4px; }
  .back-textarea{
    width:100%; border:1px solid var(--surface-edge); border-radius:12px;
    font-family:var(--font-body); font-size:14px; padding:8px 10px; resize:none;
    background:var(--paper); color:var(--ink);
  }
  .priority-row{ display:flex; align-items:center; gap:8px; }
  .priority-row input[type=range]{ flex:1; accent-color:var(--accent); }
  .priority-label{ font-size:12px; font-weight:700; color:var(--ink-soft); min-width:60px; text-align:right; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .toggle-text{ font-size:13px; color:var(--ink); line-height:1.3; }
  .toggle-text small{ display:block; color:var(--ink-soft); font-weight:400; font-size:11px; }
  .switch{
    position:relative; width:44px; height:26px; border-radius:999px;
    background:var(--ink-faint); flex:0 0 auto; cursor:pointer; border:none;
  }
  .switch.on{ background:var(--accent); }
  .switch .knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition: transform .18s ease; box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .switch.on .knob{ transform: translateX(18px); }

  .cat-select{
    width:100%; padding:8px 10px; border-radius:12px; border:1px solid var(--surface-edge);
    background:var(--paper); color:var(--ink); font-family:inherit; font-size:14px;
  }

  .back-actions{ display:flex; gap:8px; width:100%; margin-top:auto; padding-top:4px; }
  .mini-btn{
    flex:1; border:none; border-radius:12px; padding:9px 8px; font-weight:700; font-size:12.5px;
    cursor:pointer; font-family:inherit;
  }
  .mini-btn.flip-back{ background:var(--surface-edge); color:var(--ink); }
  .mini-btn.delete{ background: color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger); }

  /* ---------- Control row ---------- */
  .controls{
    display:flex; gap:10px; width:100%; max-width:340px;
  }
  .ctrl-btn{
    flex:1; border:none; border-radius:18px; padding:14px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:var(--font-body); font-weight:800; font-size:12.5px;
    cursor:pointer; box-shadow: 0 3px 0 var(--shadow);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .ctrl-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
  .ctrl-btn .glyph{ font-size:20px; }
  .ctrl-btn.skip{ background:var(--surface); color:var(--ink); border:1px solid var(--surface-edge); }
  .ctrl-btn.done{ background:var(--accent); color:var(--accent-ink); }
  .ctrl-btn.flip{ background:var(--surface); color:var(--ink); border:1px solid var(--surface-edge); }

  .empty-state{
    text-align:center; color:var(--ink-soft); padding: 30px 10px;
  }
  .empty-state .big{ font-size:34px; margin-bottom:6px; }
  .empty-state h3{ font-family:var(--font-display); color:var(--ink); margin:0 0 6px; font-size:18px; }
  .empty-state p{ margin:0 0 16px; font-size:13.5px; max-width:32ch; margin-left:auto; margin-right:auto; }

  .fab{
    position:fixed; bottom: max(22px, env(safe-area-inset-bottom)); right: calc(50% - 320px + 22px);
    width:58px; height:58px; border-radius:50%; border:none;
    background:var(--accent); color:var(--accent-ink);
    font-size:26px; font-family:var(--font-display);
    box-shadow: 0 6px 14px var(--shadow);
    cursor:pointer; z-index:40;
  }
  @media (max-width: 700px){
    .fab{ right:22px; }
  }
  .fab:active{ transform: scale(.94); }

  /* ---------- Modal / sheet ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.38);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; opacity:0; pointer-events:none; transition: opacity .18s ease;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--surface); width:100%; max-width:640px;
    border-radius: 26px 26px 0 0;
    padding: 18px 20px max(20px, env(safe-area-inset-bottom));
    transform: translateY(20px);
    transition: transform .2s ease;
    max-height: 86vh; overflow-y:auto;
  }
  .scrim.show .sheet{ transform: translateY(0); }
  .sheet h2{
    font-family:var(--font-display); font-size:20px; margin:4px 0 16px;
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:800; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.2px; }
  .field input[type=text], .field textarea, .field select{
    width:100%; border:1px solid var(--surface-edge); background:var(--paper); color:var(--ink);
    border-radius:12px; padding:11px 12px; font-family:inherit; font-size:15px;
  }
  .field textarea{ resize:none; min-height:64px; }

  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .swatch{
    width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer;
  }
  .swatch.selected{ border-color:var(--ink); }

  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; border:none; border-radius:14px; padding:13px; font-weight:800; font-size:14.5px;
    cursor:pointer; font-family:inherit;
  }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:var(--surface-edge); color:var(--ink); }

  .done-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .done-item{
    display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--surface-edge);
    border-radius:14px; padding:10px 12px;
  }
  .done-dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; }
  .done-text{ flex:1; font-size:14px; }
  .done-text .when{ display:block; font-size:11px; color:var(--ink-soft); }
  .restore-btn{
    border:none; background:var(--surface-edge); border-radius:10px; padding:6px 10px; font-size:12px;
    font-weight:700; cursor:pointer; color:var(--ink);
  }

  /* ---------- Toast ---------- */
  #toast-host{
    position:fixed; top: max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none;
  }
  .toast{
    background:var(--ink); color:var(--paper); font-size:13px; font-weight:700;
    padding:9px 16px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,.25);
    opacity:0; transform:translateY(-8px); transition: opacity .18s ease, transform .18s ease;
    max-width:80vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  @media (prefers-reduced-motion: reduce){
    .card-inner, .tray, .ctrl-btn, .sheet, .scrim{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="wordmark">
    <h1><span class="a">A</span> Round Tuit</h1>
  </div>
  <p class="tagline">Everything you've been meaning to get to — one card at a time.</p>

  <div id="view-home" class="shelf" role="list"></div>

  <div id="view-category" style="display:none;">
    <div class="cat-header">
      <button class="icon-btn" id="back-btn" aria-label="Back to shelf">←</button>
      <h2 class="cat-title" id="cat-title"></h2>
      <button class="done-pill" id="done-pill-btn">Done · <span id="done-count">0</span></button>
    </div>

    <div class="stack-mat">
      <div class="stack-count" id="stack-count">0 tuits</div>
      <div class="stack-area" id="stack-area"></div>
      <div class="controls" id="controls" style="display:none;">
        <button class="ctrl-btn flip" id="flip-btn"><span class="glyph">⟲</span>Flip</button>
        <button class="ctrl-btn skip" id="skip-btn"><span class="glyph">↧</span>Later</button>
        <button class="ctrl-btn done" id="finish-btn"><span class="glyph">✓</span>Done</button>
      </div>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="Add a tuit">+</button>

<div id="toast-host" aria-live="polite"></div>

<!-- Add/Edit Tuit sheet -->
<div class="scrim" id="tuit-scrim">
  <div class="sheet">
    <h2 id="tuit-sheet-title">New tuit</h2>
    <div class="field">
      <label for="tuit-text">What needs doing?</label>
      <textarea id="tuit-text" maxlength="140" placeholder="Water the plants"></textarea>
    </div>
    <div class="field">
      <label for="tuit-cat">Which stack?</label>
      <select id="tuit-cat"></select>
    </div>
    <div class="field">
      <label>How badly does it want your attention?</label>
      <div class="priority-row">
        <input type="range" id="tuit-priority" min="1" max="5" value="3" step="1">
        <span class="priority-label" id="tuit-priority-label">Normal</span>
      </div>
    </div>
    <div class="field toggle-row">
      <span class="toggle-text">Keeps coming back<small>Stays in the stack after you finish it</small></span>
      <button class="switch" id="tuit-repeat" role="switch" aria-checked="false"><span class="knob"></span></button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="tuit-cancel">Cancel</button>
      <button class="btn primary" id="tuit-save">Add tuit</button>
    </div>
  </div>
</div>

<!-- Add category sheet -->
<div class="scrim" id="cat-scrim">
  <div class="sheet">
    <h2>New stack</h2>
    <div class="field">
      <label for="cat-name">Name it</label>
      <input type="text" id="cat-name" maxlength="24" placeholder="Errands">
    </div>
    <div class="field">
      <label>Pick a colour</label>
      <div class="swatches" id="cat-swatches"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cat-cancel">Cancel</button>
      <button class="btn primary" id="cat-save">Create stack</button>
    </div>
  </div>
</div>

<!-- Done pile sheet -->
<div class="scrim" id="done-scrim">
  <div class="sheet">
    <h2>Done</h2>
    <div class="done-list" id="done-list"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="done-close">Close</button>
      <button class="btn primary" id="done-empty">Empty this pile</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===================== Sound engine ===================== */
  var audioCtx = null;
  function ctx(){
    if(!audioCtx){
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume().catch(function(){});
    }
    return audioCtx;
  }

  function noiseBuffer(ac, seconds){
    var len = Math.max(1, Math.floor(ac.sampleRate * seconds));
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<len;i++){ data[i] = Math.random()*2 - 1; }
    return buf;
  }

  function playThock(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.08);
    var filt = ac.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(1400, t);
    filt.frequency.exponentialRampToValueAtTime(180, t+0.09);
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(t); src.stop(t+0.12);
  }

  function playFlip(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.16);
    var filt = ac.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.setValueAtTime(900, t);
    filt.frequency.linearRampToValueAtTime(300, t+0.14);
    filt.Q.value = 0.8;
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.35, t+0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.18);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(t); src.stop(t+0.2);
    setTimeout(playThock, 150);
  }

  function playSkip(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.22);
    var filt = ac.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.setValueAtTime(1600, t);
    filt.frequency.exponentialRampToValueAtTime(260, t+0.2);
    filt.Q.value = 1.1;
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.3, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.24);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(t); src.stop(t+0.26);
    setTimeout(playThock, 190);
  }

  function playChime(freqs){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    freqs.forEach(function(f, i){
      var osc = ac.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = f;
      var gain = ac.createGain();
      var start = t + i*0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(0.22, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.4);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(start); osc.stop(start+0.42);
    });
  }
  function playComplete(){ playChime([523.25, 659.25, 784.0]); }
  function playRestore(){ playChime([392.0, 523.25]); }

  function playAdd(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(640, t+0.09);
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.28, t+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t+0.18);
  }

  function playDelete(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.28);
    var filt = ac.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(1200, t);
    filt.frequency.exponentialRampToValueAtTime(90, t+0.26);
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.32, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(t); src.stop(t+0.32);
  }

  function playTap(){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 720;
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.12, t+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t+0.08);
  }

  function playToggle(on){
    var ac = ctx(); if(!ac) return;
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(on ? 440 : 330, t);
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.2, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t+0.13);
  }

  /* ===================== Storage ===================== */
  var STORAGE_KEY = "roundTuit.v1";
  var SWATCHES = ["#FFD3B6","#BFE3C7","#D8C8EE","#B7DCEA","#F6C9D6","#F5E3A8","#BFE8DE","#C7CFF0"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function defaultState(){
    return {
      categories: [
        {id:"chores", name:"Chores", color:"#FFD3B6", builtin:true},
        {id:"groceries", name:"Groceries", color:"#BFE3C7", builtin:true},
        {id:"shopping", name:"Shopping", color:"#D8C8EE", builtin:true},
        {id:"projects", name:"Projects", color:"#B7DCEA", builtin:true}
      ],
      cards: [],
      doneCards: []
    };
  }

  var state = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.categories && parsed.cards){
          state = parsed;
          if(!state.doneCards) state.doneCards = [];
          return;
        }
      }
    }catch(e){ /* fall through to default */ }
    state = defaultState();
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      showToast("Couldn't save — your browser storage might be full.");
    }
  }

  /* ===================== Weighted shuffle ===================== */
  // Priority 1 (low) -> power 1 -> lands anywhere in the stack, uniformly.
  // Priority 5 (high) -> power 5 -> strongly biased toward the top.
  function weightedInsertIndex(length, priority){
    if(length <= 0) return 0;
    var power = Math.max(1, Math.min(5, priority || 3));
    var r = Math.pow(Math.random(), power);
    var idx = Math.floor(r * (length + 1));
    return Math.max(0, Math.min(length, idx));
  }

  function categoryCards(catId){
    return state.cards.filter(function(c){ return c.categoryId === catId; });
  }
  // order within state.cards array IS the stack order (top = index 0 within that category's slice)
  function stackOrder(catId){
    var order = [];
    state.cards.forEach(function(c, i){ if(c.categoryId === catId) order.push(i); });
    return order; // indices into state.cards, in current stack order
  }

  function removeCardGlobalIndex(idx){
    return state.cards.splice(idx, 1)[0];
  }

  function reinsertCard(card, position){
    // position: index within this category's stack (0 = top)
    var order = stackOrder(card.categoryId);
    if(order.length === 0 || position <= 0){
      // insert before the first card of this category, or at the very front if none
      var target = order.length ? order[0] : state.cards.length;
      state.cards.splice(target, 0, card);
      return;
    }
    if(position >= order.length){
      var lastIdx = order[order.length-1];
      state.cards.splice(lastIdx+1, 0, card);
      return;
    }
    var targetIdx = order[position];
    state.cards.splice(targetIdx, 0, card);
  }

    }, 2200);
  }

  function catById(id){

  function readableInk(hex){
    // simple luminance check, pastel palette is always light so dark ink reads fine,
    // kept generic in case a custom swatch trends dark.
    var c = hex.replace("#","");
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    var lum = (0.299*r + 0.587*g + 0.114*b)/255;
    return lum > 0.55 ? "#4B3B30" : "#FFFDF9";
  }

  /* ===================== Rendering: Category / stack ===================== */
  var currentCatId = null;
  var currentCardFlipped = false;

  var catTitleEl = document.getElementById("cat-title");

  function goHome(){

  function renderCategory(){
    var cat = catById(currentCatId);
    if(!cat){ goHome(); return; }
    catTitleEl.textContent = cat.name;
    catTitleEl.style.color = "inherit";
    var doneCount = state.doneCards.filter(function(d){ return d.categoryId === currentCatId; }).length;
    doneCountEl.textContent = doneCount;

    var order = stackOrder(currentCatId);
    stackCountEl.textContent = order.length + " tuit" + (order.length===1?"":"s") + " in this stack";

      return;

      b2.setAttribute("aria-hidden","true");

      b1.style.background = cat.color;
      b1.setAttribute("aria-hidden","true");

  var topCardEl = null;

  function priorityWord(p){
    return ({1:"Whenever", 2:"Someday soon", 3:"Normal", 4:"Soon", 5:"Now"})[p] || "Normal";
  }

  function renderTopCard(card, cat){
    var wrap = document.createElement("div");
    wrap.className = "card" + (currentCardFlipped ? " flipped" : "");
    wrap.id = "top-card";
    wrap.setAttribute("tabindex","0");
    wrap.setAttribute("role","button");
    wrap.setAttribute("aria-label", "Tuit card: " + card.text + ". Tap to flip.");

    var ink = readableInk(cat.color);

    var front = document.createElement("div");
    front.className = "card-face front";
    front.style.background = cat.color;
    front.style.setProperty("--card-ink", ink);
    front.innerHTML =
      (card.repeat ? '<span class="repeat-badge" title="Repeats" style="color:'+ink+'">⟳</span>' : '') +
      '<div class="task-text" style="color:'+ink+'">'+escapeHtml(card.text)+'</div>' +
      '<span class="flip-hint" style="color:'+ink+'">⤾</span>';

    var back = document.createElement("div");
    back.className = "card-face back";
    back.innerHTML = buildBackHTML(card, cat);

    var inner = document.createElement("div");
    inner.className = "card-inner";
    inner.appendChild(front);
    inner.appendChild(back);
    wrap.appendChild(inner);

    wrap.addEventListener("click", function(e){
      if(e.target.closest(".back-face-interactive")) return;
      toggleFlip();
    });
    wrap.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleFlip(); }
    });

    stackAreaEl.appendChild(wrap);
    topCardEl = wrap;
    wireBackControls(back, card);
  }

  function buildBackHTML(card, cat){
    var cats = state.categories.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===card.categoryId?" selected":"")+'>'+escapeHtml(c.name)+'</option>';
    }).join("");
    return (
      '<div class="back-row">' +
        '<p class="back-label">Edit the tuit</p>' +
        '<textarea class="back-textarea back-face-interactive" id="edit-text" rows="2" maxlength="140">'+escapeHtml(card.text)+'</textarea>' +
      '</div>' +
      '<div class="back-row">' +
        '<p class="back-label">Priority · <span id="edit-priority-label">'+priorityWord(card.priority)+'</span></p>' +
        '<div class="priority-row">' +
          '<input class="back-face-interactive" type="range" id="edit-priority" min="1" max="5" step="1" value="'+card.priority+'">' +
        '</div>' +
      '</div>' +
      '<div class="back-row toggle-row">' +
        '<span class="toggle-text">Keeps coming back<small>Stays in the stack once you finish it</small></span>' +
        '<button class="switch back-face-interactive'+(card.repeat?' on':'')+'" id="edit-repeat" role="switch" aria-checked="'+(card.repeat?"true":"false")+'"><span class="knob"></span></button>' +
      '</div>' +
      '<div class="back-row">' +
        '<p class="back-label">Move to stack</p>' +
        '<select class="cat-select back-face-interactive" id="edit-cat">'+cats+'</select>' +
      '</div>' +
      '<div class="back-actions">' +
        '<button class="mini-btn flip-back back-face-interactive" id="edit-flip-back">Flip back</button>' +
        '<button class="mini-btn delete back-face-interactive" id="edit-delete">Delete</button>' +
      '</div>'
    );
  }

  function wireBackControls(back, card){
    var textEl = back.querySelector("#edit-text");
    var priEl = back.querySelector("#edit-priority");
    var priLabel = back.querySelector("#edit-priority-label");
    var repeatBtn = back.querySelector("#edit-repeat");
    var catSel = back.querySelector("#edit-cat");
    var flipBackBtn = back.querySelector("#edit-flip-back");
    var deleteBtn = back.querySelector("#edit-delete");

    textEl.addEventListener("change", function(){
      var v = textEl.value.trim();
      if(v){ card.text = v; save(); }
      else { textEl.value = card.text; }
    });

    priEl.addEventListener("input", function(){
      priLabel.textContent = priorityWord(parseInt(priEl.value,10));
    });
    priEl.addEventListener("change", function(){
      card.priority = parseInt(priEl.value,10);
      save();
    });

    repeatBtn.addEventListener("click", function(){
      card.repeat = !card.repeat;
      repeatBtn.classList.toggle("on", card.repeat);
      repeatBtn.setAttribute("aria-checked", card.repeat ? "true":"false");
      playToggle(card.repeat);
      save();
    });

    catSel.addEventListener("change", function(){
      card.categoryId = catSel.value;
      save();
      playTap();
      renderCategory();
      showToast("Moved to " + catById(card.categoryId).name);
    });

    flipBackBtn.addEventListener("click", function(e){
      e.stopPropagation();
      toggleFlip();
    });

    deleteBtn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = state.cards.indexOf(card);
      if(idx > -1){
        state.cards.splice(idx,1);
        save();
        playDelete();
        showToast("Tuit deleted");
        currentCardFlipped = false;
        renderCategory();
      }
    });
  }

  function toggleFlip(){
    currentCardFlipped = !currentCardFlipped;
    playFlip();
    if(topCardEl) topCardEl.classList.toggle("flipped", currentCardFlipped);
  }

  /* ---- Later (skip) ---- */
  document.getElementById("skip-btn").addEventListener("click", function(){
    var order = stackOrder(currentCatId);
    if(order.length === 0) return;
    var card = removeCardGlobalIndex(order[0]);
    var remaining = stackOrder(currentCatId).length; // after removal
    var pos = weightedInsertIndex(remaining, card.priority);
    reinsertCard(card, pos);
    save();
    playSkip();
    currentCardFlipped = false;
    renderCategory();
  });

  /* ---- Done ---- */
  document.getElementById("finish-btn").addEventListener("click", function(){
    var order = stackOrder(currentCatId);
    if(order.length === 0) return;
    var card = removeCardGlobalIndex(order[0]);
    if(card.repeat){
      var remaining = stackOrder(currentCatId).length;
      var pos = weightedInsertIndex(remaining, card.priority);
      reinsertCard(card, pos);
      showToast("Nice — back in the deck for next time");
    } else {
      state.doneCards.unshift({
        id: card.id, text: card.text, categoryId: card.categoryId,
        priority: card.priority, repeat: card.repeat, doneAt: Date.now()
      });
      showToast("Done! 🎉");
    }
    save();
    playComplete();
    currentCardFlipped = false;
    renderCategory();
  });

  /* ===================== Add Category sheet ===================== */
  var catScrim = document.getElementById("cat-scrim");

  /* ===================== Done pile sheet ===================== */
  var doneScrim = document.getElementById("done-scrim");
  var doneListEl = document.getElementById("done-list");

  function timeAgo(ts){
    var s = Math.floor((Date.now()-ts)/1000);
    if(s < 60) return "just now";
    var m = Math.floor(s/60); if(m < 60) return m+"m ago";
    var h = Math.floor(m/60); if(h < 24) return h+"h ago";
    var d = Math.floor(h/24); return d+"d ago";
  }

  function openDonePile(){
    var items = state.doneCards.filter(function(d){ return d.categoryId === currentCatId; });
    if(items.length === 0){
      doneListEl.innerHTML = '<div class="empty-state" style="padding:10px 4px;"><p>Nothing finished yet in this stack.</p></div>';
    } else {
      var cat = catById(currentCatId);
      doneListEl.innerHTML = items.map(function(d){
        return '<div class="done-item" data-id="'+d.id+'">' +
          '<span class="done-dot" style="background:'+ (cat?cat.color:"#ccc") +'"></span>' +
          '<span class="done-text">'+escapeHtml(d.text)+'<span class="when">'+timeAgo(d.doneAt)+'</span></span>' +
          '<button class="restore-btn" data-id="'+d.id+'">Restore</button>' +
        '</div>';
      }).join("");
      Array.prototype.forEach.call(doneListEl.querySelectorAll(".restore-btn"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var idx = state.doneCards.findIndex(function(d){ return d.id===id; });
          if(idx === -1) return;
          var d = state.doneCards.splice(idx,1)[0];
          var card = {id:d.id, text:d.text, categoryId:d.categoryId, priority:d.priority, repeat:d.repeat};
          var existingCount = categoryCards(card.categoryId).length;
          var pos = weightedInsertIndex(existingCount, card.priority);
          reinsertCard(card, pos);
          save();
          playRestore();
          showToast("Back in the stack");
          openDonePile();
          renderCategory();
        });
      });
    }
    doneScrim.classList.add("show");
  }
  function closeDonePile(){ doneScrim.classList.remove("show"); }

  document.getElementById("done-pill-btn").addEventListener("click", function(){ playTap(); openDonePile(); });
  document.getElementById("done-close").addEventListener("click", function(){ playTap(); closeDonePile(); });
  doneScrim.addEventListener("click", function(e){ if(e.target === doneScrim) closeDonePile(); });

  document.getElementById("done-empty").addEventListener("click", function(){
    var before = state.doneCards.length;
    state.doneCards = state.doneCards.filter(function(d){ return d.categoryId !== currentCatId; });
    if(before !== state.doneCards.length){
      save();
      playDelete();
      showToast("Done pile emptied");
      openDonePile();
      renderCategory();
    }
  });

  /* ===================== Init ===================== */
  load();
  renderHome();
})();
</script>
</body>
</html>
